services:
  api:
    build: .
    container_name: mi_api_django
    restart: always
    ports:
      - "8090:8090"
    volumes:
      - .:/app
    environment:
      - PYTHONUNBUFFERED=1
    command: >
      sh -c "python manage.py migrate && 
             python manage.py collectstatic --noinput && 
             gunicorn drf.wsgi:application --bind 0.0.0.0:8090"